name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q server.py winbridge_core.py winbridge_desktop_control.py winbridge_terminal.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
